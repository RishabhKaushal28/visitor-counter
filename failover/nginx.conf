events {}

http {
    upstream visitor {
        # Primary: private cluster (kind-private, host port 8081)
        server host.docker.internal:8081 max_fails=1 fail_timeout=3s;
        # Backup: public / simulated public cluster (kind-public, host port 8082)
        server host.docker.internal:8082 backup;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://visitor;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
